<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DecodeLabs — Intern Management (Project 4)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🧩 DecodeLabs Intern Manager</h1>
    <p class="subtitle">Full Stack Project 4 — Frontend &amp; Backend Integration</p>
  </header>

  <main>
    <!-- Add / Edit form -->
    <section class="card">
      <h2 id="form-title">Add New Intern</h2>
      <form id="intern-form">
        <input type="hidden" id="intern-id" />
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" required placeholder="e.g. Riya Kapoor" />
        </div>
        <div class="field">
          <label for="role">Role</label>
          <input type="text" id="role" required placeholder="e.g. Frontend Intern" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="e.g. riya@decodelabs.tech" />
        </div>
        <div class="field">
          <label for="contact">Contact Number</label>
          <input type="text" id="contact" placeholder="e.g. 9000000000" />
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Add Intern</button>
          <button type="button" id="cancel-edit-btn" class="secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Status / error banner -->
    <div id="banner" class="banner hidden"></div>

    <!-- Data section -->
    <section class="card">
      <div class="list-header">
        <h2>Interns</h2>
        <button id="refresh-btn" class="secondary">🔄 Refresh</button>
      </div>

      <div id="loading" class="loading hidden">
        <span class="spinner"></span> Loading interns…
      </div>

      <div id="empty-state" class="empty hidden">
        No interns yet — add one above.
      </div>

      <ul id="intern-list" class="intern-list"></ul>
    </section>
  </main>

  <footer>
    <p>Backend expected at <code id="api-base-display"></code> — start it with <code>npm start</code> inside <code>/backend</code>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
